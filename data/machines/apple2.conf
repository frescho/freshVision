# freshVision built-in machine file (shipped with the program, replaced by
# every upgrade: don't edit it here). To change a mode, tune it in freshVision
# and save it: it goes to "My modes" in your settings folder and takes
# precedence. Format: see src/machines.h.
[machine]
format_version=2
group=Apple
revision=1
name=Apple II (NTSC)
note=Prepared from documentation, not yet tested: click-only. 912 14-MHz periods per line = 228 carrier cycles, 262 lines, ~59.92 Hz; colour is artifact colour; text mode switches the colour burst off (weakly on early boards). The same timing as an MSX1, so it can't be told apart by timing.

[mode Composite 8x]
revision=1
match_input=Sync On Green
match_refresh=59.92 +-0.03
match_cycles_per_line=228 +-0.1
match_manual=1
match_no_colour_on=blue
hint=NTSC composite, 8x, line 912, Apple II profile; whole frame re-aligned (the card doesn't hold the IIc's vertical sync); text mode is black and white
device_path=
format=g8
width=1664
height=262
crop_set=0
crop_x=0
crop_y=0
crop_w=0
crop_h=0
display_scale_mode=Integer
display_linear_filter=0
display_pixel_aspect=1
display_integer_factor=0
rgb_autotune=0
rgb_autocrop=0
rgb_screen_size=0x0
pal_decode=1
pal_multiple=8
pal_svideo=0
pal_svideo_channels=G,B
pal_line=912
video_standard=ntsc
pal_autotune=1
pal_luma=1
pal_average_lines=1
pal_clock_stripes=0
pal_relock=1
pal_chroma_cycles=2
pal_edge_desat=0
pal_soft_text=0
pal_brightness=0
pal_contrast=1
pal_saturation=1
pal_hue=0
pal_gamma=1
pal_profile=9
pal_pixel_grid=0
pal_grid_core=0.5
pal_snap=0
pal_colours=16
pal_palette_source=0
pal_c64_cells=0
pal_tms_cells=0
pal_pll=1
pal_pll_speed=0.2
pal_custom_palette=
control_count=1
control.0.name=Vertical Timing
control.0.value=262
