# freshVision built-in machine file (shipped with the program, replaced by
# every upgrade: don't edit it here). To change a mode, tune it in freshVision
# and save it: it goes to "My modes" in your settings folder and takes
# precedence. Format: see src/machines.h.
[machine]
format_version=2
group=Commodore
revision=1
name=Commodore 64 (PAL)
note=Composite (luma+chroma) on the Green input via Sync-on-Green. Frame 50.125 Hz, 283.5 carrier cycles per line (measured). After a reboot the card may detect it at 31,250 Hz: re-plug the cable.

[mode Composite 8x]
revision=1
match_input=Sync On Green
match_refresh=50.125 +-0.02
match_cycles_per_line=283.5 +-0.1
match_no_colour_on=blue
hint=8x sampling, line 1134, line averaging, C64 palette; auto-tune sets the black level
device_path=
format=g8
width=2048
height=298
crop_set=0
crop_x=0
crop_y=0
crop_w=0
crop_h=0
display_scale_mode=Integer
display_linear_filter=0
display_pixel_aspect=1
display_integer_factor=0
rgb_autotune=0
rgb_autocrop=0
rgb_screen_size=0x0
pal_decode=1
