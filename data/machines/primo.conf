# freshVision built-in machine file (shipped with the program, replaced by
# every upgrade: don't edit it here). To change a mode, tune it in freshVision
# and save it: it goes to "My modes" in your settings folder and takes
# precedence. Format: see src/machines.h.
[machine]
format_version=2
group=Microkey
revision=2
name=Primo
note=Black and white composite (no colour burst) on the Green input via Sync-on-Green. Measured 2026-10-10: 15,629 Hz lines, 50.083 Hz frames (312 lines); the picture starts ~20.5 us after the sync edge, rows 57-249 of the 298 captured. Click-only: a ZX Spectrum 48K has nearly the same frame rate. If the card shows no steady picture, use "Card's detected timing" or re-plug the cable.

[mode Composite B/W 8x]
revision=2
match_input=Sync On Green
match_manual=1
hint=8x sampling, black and white (grey picture), black level per line; auto-tune sets the black level
