# freshVision built-in machine file (shipped with the program, replaced by
# every upgrade: don't edit it here). To change a mode, tune it in freshVision
# and save it: it goes to "My modes" in your settings folder and takes
# precedence. Format: see src/machines.h.
[machine]
format_version=2
group=MSX
revision=1
name=MSX1 (NTSC, TMS9918)
note=Tested on a Casio MX-10: locks at 60 frames/s; TMS9918A at 3x the subcarrier, 228 carrier cycles per line, 262 lines, ~59.92 Hz; its burst is ~11 IRE (profile burst scale 0.275), hue -6 deg. Click-only: an Apple II has the same timing.

[mode Composite 12x]
revision=1
match_input=Sync On Green
match_refresh=59.92 +-0.03
match_cycles_per_line=228 +-0.1
match_manual=1
match_no_colour_on=blue
hint=NTSC composite, 12x (8 samples per pixel), line 912, TMS9918 profile, two-colour text (soft; untick for colourful screens) (burst ~11 IRE, hue -6 deg)
device_path=
format=g8
width=2496
height=240
crop_set=0
crop_x=0
crop_y=0
crop_w=0
crop_h=0
display_scale_mode=Integer
display_linear_filter=0
display_pixel_aspect=1
display_integer_factor=0
rgb_autotune=0
rgb_autocrop=0
rgb_screen_size=0x0
pal_decode=1
pal_multiple=12
pal_svideo=0
pal_svideo_channels=G,B
pal_line=912
video_standard=ntsc
pal_autotune=1
pal_luma=1
pal_average_lines=1
pal_clock_stripes=0
pal_relock=0
pal_chroma_cycles=2
pal_edge_desat=0
pal_soft_text=1
pal_brightness=0
pal_contrast=1
pal_saturation=1
pal_hue=-6
pal_gamma=1
pal_profile=10
pal_pixel_grid=0
pal_grid_core=0.5
pal_snap=0
pal_colours=16
pal_palette_source=0
pal_c64_cells=0
pal_tms_cells=0
pal_pll=1
