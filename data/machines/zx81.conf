# freshVision built-in machine file (shipped with the program, replaced by
# every upgrade: don't edit it here). To change a mode, tune it in freshVision
# and save it: it goes to "My modes" in your settings folder and takes
# precedence. Format: see src/machines.h.
[machine]
format_version=2
group=Sinclair
revision=1
name=ZX81 (PAL)
note=Prepared from documentation, not yet tested: click-only. Black and white, RF only: composite needs the usual modulator-input mod. 6.5 MHz pixel clock, 207 CPU cycles (3.25 MHz) per line = 15,700 Hz; the frame is made by software: about 311 lines, 50.66 Hz (MAME). FAST mode stops the picture while a program runs. Early ULAs (2C184E) have no back porch: a capture card may see a dark or no picture.

[mode Composite B/W 8x]
revision=1
match_input=Sync On Green
match_manual=1
match_refresh=50.66 +-0.15
hint=Composite B/W (mod): 8x, grey picture, line 1130 (207 CPU cycles), black level per line
device_path=
format=g8
width=2048
height=298
crop_set=0
