# freshVision built-in machine file (shipped with the program, replaced by
# every upgrade: don't edit it here). To change a mode, tune it in freshVision
# and save it: it goes to "My modes" in your settings folder and takes
# precedence. Format: see src/machines.h.
[machine]
format_version=2
group=Commodore Amiga
revision=1
name=Amiga 1200 (PAL)
note=Prepared from documentation, not yet tested: every mode is click-only (same line and frame as the ZX Spectrum and the BBC Micro). PAL: 28.37516 MHz crystal, 227 colour clocks = 1816 crystal cycles (283.75 PAL colour cycles) per line, 15,625.09 Hz; 312 lines = 50.08 Hz without interlace, 625 lines interlaced. 23-pin RGB port: analog R/G/B about 0.7 V into 75 ohm (pins 3-5), composite sync pin 10, H/V sync 11/12 (levels unverified). Screen 320 or 640 x 256 (512 interlaced). The A1200 has a colour composite socket and RF.

[mode Composite 8x]
revision=1
match_input=Sync On Green
match_manual=1
match_refresh=50.08 +-0.06
hint=Composite (colour, RCA): 8x, line 1135; palette learned (4096 colours)
device_path=
format=g8
width=2048
height=298
crop_set=0
crop_x=0
crop_y=0
crop_w=0
crop_h=0
display_scale_mode=Integer
display_linear_filter=0
display_pixel_aspect=1
display_integer_factor=0
rgb_autotune=0
rgb_autocrop=0
rgb_screen_size=0x0
pal_decode=1
pal_multiple=8
pal_svideo=0
pal_svideo_channels=G,B
pal_line=1135
video_standard=pal
pal_autotune=1
pal_luma=1
pal_average_lines=1
pal_clock_stripes=0
pal_relock=0
pal_chroma_cycles=2
pal_edge_desat=0
pal_soft_text=0
pal_brightness=0
pal_contrast=1
pal_saturation=1
pal_hue=0
pal_gamma=1
