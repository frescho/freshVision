# freshVision built-in machine file (shipped with the program, replaced by
# every upgrade: don't edit it here). To change a mode, tune it in freshVision
# and save it: it goes to "My modes" in your settings folder and takes
# precedence. Format: see src/machines.h.
[machine]
format_version=2
group=Commodore
revision=1
name=Commodore 16 / Plus/4 (PAL)
note=Prepared from documentation, not yet tested: every mode is click-only. TED (7360/8360): 17.734475 MHz crystal, 1140 crystal cycles (285 colour cycles) per line, 312 lines: 15,556.6 Hz lines, 49.861 Hz frames, not the C64's 283.75 cycles. 121 colours. 8-pin A/V DIN as on the C64: 1 luma, 2 ground, 4 composite, 6 chroma, so S-Video works with the C64 cable (chroma level unmeasured). Burst and PAL line switching of the TED are undocumented.

[mode Composite 8x]
revision=1
match_input=Sync On Green
match_manual=1
match_refresh=49.86 +-0.05
hint=Composite: 8x, line 1140 (285 colour cycles), TED palette (121 colours)
device_path=
format=g8
width=2048
height=298
crop_set=0
crop_x=0
crop_y=0
crop_w=0
crop_h=0
display_scale_mode=Integer
display_linear_filter=0
display_pixel_aspect=1
display_integer_factor=0
rgb_autotune=0
rgb_autocrop=0
rgb_screen_size=0x0
pal_decode=1
pal_multiple=8
pal_svideo=0
pal_svideo_channels=G,B
pal_line=1140
video_standard=pal
pal_autotune=1
pal_luma=1
pal_average_lines=1
pal_clock_stripes=0
pal_relock=0
pal_chroma_cycles=2
pal_edge_desat=0
pal_soft_text=0
pal_brightness=0
pal_contrast=1
pal_saturation=1
pal_hue=0
pal_gamma=1
pal_profile=3
