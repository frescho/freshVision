# freshVision built-in machine file (shipped with the program, replaced by
# every upgrade: don't edit it here). To change a mode, tune it in freshVision
# and save it: it goes to "My modes" in your settings folder and takes
# precedence. Format: see src/machines.h.
[machine]
format_version=2
group=Generic
revision=1
name=Generic PAL
note=The fallback: any composite source on the Sync-on-Green input. Everything is detected from the picture. PAL for ~50 Hz sources; the NTSC mode (~60 Hz) is click-only until NTSC is tested on the card.

[mode Composite 8x]
