# freshVision built-in machine file (shipped with the program, replaced by
# every upgrade: don't edit it here). To change a mode, tune it in freshVision
# and save it: it goes to "My modes" in your settings folder and takes
# precedence. Format: see src/machines.h.
[machine]
format_version=2
group=Acorn
revision=1
name=BBC Micro Model B (PAL)
note=Prepared from documentation, not yet tested on a BBC: every mode is click-only. Composite (BNC) is monochrome unless link S39 is fitted (issues 4-7; earlier boards also need a 470 pF capacitor). RGB (6-pin DIN: 1 red, 2 green, 3 blue, 4 composite sync, 5 0V) is 5 V TTL and needs an attenuating cable. No S-Video socket: S-Video needs a board modification or a converter.

[mode Composite 8x]
revision=1
match_input=Sync On Green
match_refresh=50.04 +-0.06
match_cycles_per_line=283.75 +-0.1
match_manual=1
match_no_colour_on=blue
hint=Composite: black and white unless link S39 is fitted; 8x, line 1135, BBC palette
device_path=
format=g8
width=2048
height=298
crop_set=0
crop_x=0
crop_y=0
crop_w=0
crop_h=0
display_scale_mode=Integer
display_linear_filter=0
display_pixel_aspect=1
display_integer_factor=0
rgb_autotune=0
rgb_autocrop=0
rgb_screen_size=0x0
pal_decode=1
pal_multiple=8
pal_svideo=0
pal_svideo_channels=G,B
pal_line=1135
video_standard=pal
pal_autotune=1
pal_luma=1
pal_average_lines=1
pal_clock_stripes=0
pal_relock=0
pal_chroma_cycles=2
pal_edge_desat=0
pal_soft_text=0
pal_brightness=0
pal_contrast=1
pal_saturation=1
pal_hue=0
pal_gamma=1
pal_profile=7
pal_pixel_grid=0
pal_grid_core=0.5
pal_snap=0
pal_colours=16
pal_palette_source=0
