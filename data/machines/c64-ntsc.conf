# freshVision built-in machine file (shipped with the program, replaced by
# every upgrade: don't edit it here). To change a mode, tune it in freshVision
# and save it: it goes to "My modes" in your settings folder and takes
# precedence. Format: see src/machines.h.
[machine]
format_version=2
group=Commodore
revision=1
name=Commodore 64 (NTSC)
note=Prepared from documentation, not yet tested: click-only. VIC-II 6567R8: 65 cycles x 263 lines, 59.83 Hz, 227.5 carrier cycles per line (910 samples at 4x). Composite on the Green input like the PAL C64.

[mode Composite 8x]
revision=1
match_input=Sync On Green
match_refresh=59.83 +-0.03
match_cycles_per_line=227.5 +-0.1
match_manual=1
match_no_colour_on=blue
hint=NTSC composite, 8x, line 910, C64 NTSC profile; window and height unverified
